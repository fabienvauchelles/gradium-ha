name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Home Assistant 2026.9 needs Python 3.14, and the Makefile provisions it
      # through uv rather than relying on whatever the runner ships.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Provision the environment
        run: make build

      - name: Gate (ruff, mypy, pytest)
        run: make check

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the manifest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The license check requires an OSI-approved licence. FSL-1.1-MIT is
      # source-available by choice and not OSI-approved, so the check can
      # never pass; it only gates the HACS default store, not installation
      # as a custom repository, which is how this integration is published.
      - name: Validate for HACS
        uses: hacs/action@main
        with:
          category: integration
          ignore: license
